<div class="login-page">
  <div class="login-card">

    <div class="brand-section">
      <div class="brand-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>

      <h2>e-Likizo</h2>
      <p>Password Recovery</p>
    </div>

    <p class="info-text">
      Enter your registered email address.
      If your account exists, we will send you a password reset link.
    </p>

    <div class="alert-success" *ngIf="successMessage">
      <i class="bi bi-check-circle"></i>
      {{ successMessage }}
    </div>

    <div class="alert-error" *ngIf="errorMessage">
      <i class="bi bi-exclamation-circle"></i>
      {{ errorMessage }}
    </div>

    <form [formGroup]="forgotForm"
          (ngSubmit)="onSubmit()"
          novalidate>

      <div class="form-group">
        <label for="email">Email Address</label>

        <div class="input-wrapper">
          <i class="bi bi-envelope"></i>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            [class.invalid]="f['email'].invalid &&
              (f['email'].touched || submitted)">
        </div>

        <small class="error-message"
          *ngIf="f['email'].hasError('required') &&
          (f['email'].touched || submitted)">
          Email is required.
        </small>

        <small class="error-message"
          *ngIf="f['email'].hasError('email') &&
          !f['email'].hasError('required') &&
          (f['email'].touched || submitted)">
          Please enter a valid email address.
        </small>
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading">

        <span *ngIf="!loading">
          Send Reset Link
          <i class="bi bi-arrow-right"></i>
        </span>

        <span *ngIf="loading">
          <i class="bi bi-arrow-repeat spinning"></i>
          Please wait...
        </span>
      </button>

      <div class="register-section">
        <a routerLink="/login" class="register-link">
          <i class="bi bi-arrow-left"></i>
          Back to Login
        </a>
      </div>

    </form>

    <div class="login-footer">
      <p>
        <i class="bi bi-shield-check"></i>
        Secure Employee Portal
      </p>
      <small>&copy; 2026 e-Likizo System</small>
    </div>

  </div>
</div>
