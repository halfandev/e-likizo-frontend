<aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">
  <div class="sidebar-header">
    <a class="brand-mark" href="index.html" aria-label="adminHMD dashboard">
      <span class="brand-icon"><i class="bi bi-grid-1x2-fill"
          aria-hidden="true"></i></span>
      <span class="brand-copy">
        <span class="brand-title">e-likizo</span>
        <span class="brand-subtitle">Police Management</span>
      </span>
    </a>
  </div>

  <nav class="sidebar-nav">

    <!-- Dashboard -->
    <a
      class="nav-link"
      routerLink="/dashboard"
      *ngIf="isAdmin">
      <span class="nav-icon">
        <i class="bi bi-speedometer2"></i>
      </span>
      <span class="nav-text">Admin Dashboard</span>
    </a>

    <a
      class="nav-link"
      routerLink="/hr-dashboard"
      *ngIf="isHR">
      <span class="nav-icon">
        <i class="bi bi-speedometer2"></i>
      </span>
      <span class="nav-text">HR Dashboard</span>
    </a>

    <a
      class="nav-link"
      routerLink="/employee-dashboard"
      *ngIf="isEmployee">
      <span class="nav-icon">
        <i class="bi bi-speedometer2"></i>
      </span>
      <span class="nav-text">Employee Dashboard</span>
    </a>

    <a
      class="nav-link"
      routerLink="/employee/apply-leave"
      *ngIf="isEmployee">
      <span class="nav-icon">
        <i class="fa fa-calendar"></i> </span>
      <span class="nav-text">Apply for leave</span>
    </a>


    <a
      class="nav-link"
      routerLink="/my-dependents"
      *ngIf="isEmployee">
      <span class="nav-icon">
      <i class="fa fa-users"></i>
       </span>
      <span class="nav-text">my dependant</span>
    </a>


    <!-- <a routerLink="/my-dependents" routerLinkActive="active">
      <i class="fa fa-users"></i>
      <span>My Dependents</span>
    </a> -->

    <!-- User Management Dropdown: Admin Only -->
    <div class="nav-dropdown" *ngIf="isAdmin">

      <button
        type="button"
        class="nav-link nav-dropdown-toggle"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-controls="userManagementSubmenu">

        <span class="nav-icon">
          <i class="bi bi-people"></i>
        </span>

        <span class="nav-text">User Management</span>

        <span class="dropdown-arrow">
          <i
            class="bi"
            [ngClass]="isUserMenuOpen
          ? 'bi-chevron-up'
          : 'bi-chevron-down'">
          </i>
        </span>
      </button>

      <div
        class="nav-submenu"
        id="userManagementSubmenu"
        *ngIf="isUserMenuOpen">

        <a
          class="nav-link submenu-link"
          routerLink="/users"
          routerLinkActive="active">
          <i class="bi bi-people"></i>
          <span>Users</span>
        </a>

        <a
          class="nav-link submenu-link"
          routerLink="/add-user"
          routerLinkActive="active">
          <i class="bi bi-person-plus"></i>
          <span>Add User</span>
        </a>

      </div>
    </div>

    <!-- Employee Management Dropdown: Admin Only -->
    <div class="nav-dropdown" *ngIf="isAdmin">

      <button
        type="button"
        class="nav-link nav-dropdown-toggle"
        (click)="toggleEmployeeMenu()"
        [attr.aria-expanded]="isEmployeeMenuOpen"
        aria-controls="employeeManagementSubmenu">

        <span class="nav-icon">
          <i class="bi bi-person-vcard"></i>
        </span>

        <span class="nav-text">Employee Management</span>

        <span class="dropdown-arrow">
          <i
            class="bi"
            [ngClass]="isEmployeeMenuOpen
          ? 'bi-chevron-up'
          : 'bi-chevron-down'">
          </i>
        </span>
      </button>

      <div
        class="nav-submenu"
        id="employeeManagementSubmenu"
        *ngIf="isEmployeeMenuOpen">

        <a
          class="nav-link submenu-link"
          routerLink="/employees"
          routerLinkActive="active">
          <i class="bi bi-people"></i>
          <span>Employees</span>
        </a>

        <!-- <a
      class="nav-link submenu-link"
      routerLink="/add-employee"
      routerLinkActive="active">
      <i class="bi bi-person-plus"></i>
      <span>Add Employee</span>
    </a> -->

      </div>
    </div>

    <!-- Leave Management Dropdown: Admin Only -->
    <div class="nav-dropdown" *ngIf="isAdmin">

      <button
        type="button"
        class="nav-link nav-dropdown-toggle"
        (click)="toggleLeaveMenu()"
        [attr.aria-expanded]="isLeaveMenuOpen"
        aria-controls="leaveManagementSubmenu">

        <span class="nav-icon">
          <i class="bi bi-calendar2-check"></i>
        </span>

        <span class="nav-text">Leave Management</span>

        <span class="dropdown-arrow">
          <i
            class="bi"
            [ngClass]="isLeaveMenuOpen
          ? 'bi-chevron-up'
          : 'bi-chevron-down'">
          </i>
        </span>
      </button>

      <div
        class="nav-submenu"
        id="leaveManagementSubmenu"
        *ngIf="isLeaveMenuOpen">

        <!-- Manage Leave Types -->
        <a
          class="nav-link submenu-link"
          routerLink="/admin/leave-types"
          routerLinkActive="active">

          <i class="bi bi-list-check"></i>
          <span>Leave Types</span>
        </a>

        <!-- Leave Applications -->
        <a
          class="nav-link submenu-link"
          routerLink="/admin/leave-applications"
          routerLinkActive="active">

          <i class="bi bi-calendar2-week"></i>
          <span>Leave Applications</span>
        </a>

        <!-- Pending Leave Applications -->
        <a
          class="nav-link submenu-link"
          routerLink="/admin/pending-leaves"
          routerLinkActive="active">

          <i class="bi bi-hourglass-split"></i>
          <span>Pending Applications</span>
        </a>

      </div>
    </div>

    <!-- Shared Profile -->
    <!-- <a class="nav-link" routerLink="/profile">
      <span class="nav-icon">
        <i class="bi bi-person-circle"></i>
      </span>
      <span class="nav-text">Profile</span>
    </a> -->

    <!-- Administrative Dropdown: Admin Only -->
    <div class="nav-dropdown" *ngIf="isAdmin">

      <button
        type="button"
        class="nav-link nav-dropdown-toggle"
        (click)="toggleAdministrativeMenu()"
        [attr.aria-expanded]="isAdministrativeMenuOpen"
        aria-controls="administrativeSubmenu">

        <span class="nav-icon">
          <i class="bi bi-diagram-3"></i>
        </span>

        <span class="nav-text">Administrative</span>

        <span class="dropdown-arrow">
          <i
            class="bi"
            [ngClass]="isAdministrativeMenuOpen
          ? 'bi-chevron-up'
          : 'bi-chevron-down'">
          </i>
        </span>
      </button>

      <!-- Submenu -->
      <div
        class="nav-submenu"
        id="administrativeSubmenu"
        *ngIf="isAdministrativeMenuOpen">

        <a
          class="nav-link submenu-link"
          routerLink="/admin/administratives"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <i class="bi bi-building"></i>
          <span>Administrative</span>
        </a>

        <a
          class="nav-link submenu-link"
          routerLink="/admin/regions"
          routerLinkActive="active">

          <i class="bi bi-geo-alt"></i>
          <span>Regions</span>
        </a>

        <a
          class="nav-link submenu-link"
          routerLink="/admin/districts"
          routerLinkActive="active">

          <i class="bi bi-map"></i>
          <span>Districts</span>
        </a>

        <a
          class="nav-link submenu-link"
          routerLink="/admin/stations"
          routerLinkActive="active">

          <i class="bi bi-houses"></i>
          <span>Stations</span>
        </a>

      </div>
    </div>

  </nav>

  <div class="sidebar-footer">
    <span class="status-dot"></span>
    <span class="sidebar-footer-text">System running smoothly</span>
  </div>
</aside>
